name: CI — Monorepo Lint, Typecheck, Test & Docker Verification

on:
  push:
    branches: ["main", "master", "develop"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "services/browser-bridge/**"
      - "Caddyfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Backend Ruff (Linter and Formatter) ----------
  backend-ruff:
    name: Backend Ruff Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff Lint
        run: uv run ruff check src tests

      - name: Run Ruff Format Check
        run: uv run ruff format --check src tests

  # ---------- Backend static audit and Pytest suite ----------
  backend-tests:
    name: Backend MyPy, Vulture & Pytest
    needs: [backend-ruff]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: ./backend
    env:
      PYTHONUNBUFFERED: "1"
      ENVIRONMENT: "development"
      DEBUG: "false"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      SECRET_KEY: "ci-secret-key-32-bytes-long-12345678"
      OPENROUTER_API_KEY: "sk-or-placeholder-for-tests"
      FIREWORKS_API_KEY: "fw-placeholder-for-tests"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/pyproject.toml"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --dev

      - name: Vulture Dead-Code Audit
        run: uv run vulture src/app

      - name: Mypy Static Type Checker
        run: uv run mypy src tests

      - name: Install Playwright Chromium & System Libraries
        run: uv run playwright install --with-deps chromium

      - name: Run Pytest Suite (250+ Tests)
        run: uv run pytest -v --tb=short --junitxml=pytest-report.xml

  # ---------- Frontend lint, typecheck and vite build ----------
  frontend-quality:
    name: Frontend Oxlint, TypeScript & Vite Build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm install

      - name: Run Oxlint
        run: npm run lint

      - name: TypeScript Check & Vite Production Build
        run: npm run build

  # ---------- Go Browser bridge test and build ----------
  bridge-quality:
    name: Go Browser Bridge Tests & Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 6
    defaults:
      run:
        working-directory: ./services/browser-bridge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "services/browser-bridge/go.mod"
          cache-dependency-path: "services/browser-bridge/go.sum"

      - name: Download Go Modules
        run: go mod download

      - name: Run Unit Tests
        run: go test -v -race ./test/...

      - name: Verify Binary Build
        run: go build -v ./cmd/server

  # ---------- Docker Build Validation (Pull Requests & Manual Dispatch) ----------
  docker-build-check:
    name: Docker Buildx Pre-Flight
    needs: [backend-tests, frontend-quality, bridge-quality]
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Free up Runner Disk (+28GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Backend Docker Build (No Push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Test Frontend Docker Build (No Push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Test Browser Bridge Docker Build (No Push)
        uses: docker/build-push-action@v6
        with:
          context: ./services/browser-bridge
          file: ./services/browser-bridge/Dockerfile
          push: false
          cache-from: type=gha,scope=bridge
          cache-to: type=gha,mode=max,scope=bridge