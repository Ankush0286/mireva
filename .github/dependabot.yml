version: 2
updates:
  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Python Backend Dependencies (Astral uv)
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Node.js Frontend Dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Docker Images (Backend)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1

  # Docker Images (Frontend)
  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1

  # Docker Images (Go Browser)
  - package-ecosystem: "docker"
    directory: "/services/browser-bridge"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    